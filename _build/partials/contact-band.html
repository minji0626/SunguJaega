        <!-- 연락처 띠 (여러 페이지 공통) -->
        <section class="contact-band" aria-labelledby="contact-title">
            <div class="wrap">
                <div>
                    <h2 id="contact-title">궁금한 점은 전화로 편하게 물어보세요</h2>
                    <p>등급이 없어도, 아직 결정하지 않으셨어도 괜찮습니다.</p>
                    <a class="band-number" href="tel:{{TEL}}">{{PHONE}}</a>
                </div>
                <dl class="contact-list">
                    <dt>주소</dt>
                    <dd>{{ADDRESS}}</dd>
                    <dt>상담 시간</dt>
                    <dd>{{HOURS}}</dd>
                    <dt>팩스</dt>
                    <dd>{{FAX}}</dd>
                    <dt>이메일</dt>
                    <dd><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></dd>
                    <dt>찾아오기</dt>
                    <dd><a href="{{BASE}}location">오시는 길 안내</a></dd>
                </dl>
            </div>
        </section>
